
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Smart - Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h2>Rent Smart</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
        </div>
    </div>

    <!-- Profile Container -->
    <div class="container">

        <div class="profile-box">

            <h2>My Profile</h2>
            <p>Manage your personal information</p>

            <!-- Profile Picture -->
            <div class="profile-picture">
                <img src="profile.jpg" alt="">
            </div>

            <h3 class="username">John Doe</h3>
            <p class="user-role">Rent Smart User</p>

            <!-- Personal Information -->
            <div class="details">

                <h3>Personal Information</h3>

                <div class="info">
                    <label>Full Name</label>
                    <p>John Doe</p>
                </div>

                <div class="info">
                    <label>Email Address</label>
                    <p>johnDoe@gmail.com</p>
                </div>

                <div class="info">
                    <label>Phone Number</label>
                    <p>+265</p>
                </div>

                <div class="info">
                    <label>Username</label>
                    <p>JohnDoe</p>
                </div>

                <div class="info">
                    <label>University of Livingstonia</label>
                    <p>Laws campus</p>
                </div>

            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="edit-btn">Edit Profile</button>
                <button class="logout-btn">Logout</button>
            </div>

        </div>

    </div>

</body>
</html>
